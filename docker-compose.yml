services:
  db:
    image: postgres:14-alpine
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_platform_network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py seed_agents"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai_platform_network

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_platform_network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    env_file:
      - ./.env
    command: server /data --console-address ":9001"
    networks:
      - ai_platform_network

  elasticsearch:
    image: elasticsearch:8.11.1
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ai_platform_network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - ai_platform_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: gunicorn --bind 0.0.0.0:8000 ai_agent.backend_core.asgi:application -k uvicorn.workers.UvicornWorker --workers 4
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./ai_agent:/app/ai_agent
      - ./ai_agent/data:/app/ai_agent/data
    networks:
      - ai_platform_network

  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A ai_agent.backend_core worker -l info
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./.env
    networks:
      - ai_platform_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ai_platform_network

networks:
  ai_platform_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  elasticsearch_data:
